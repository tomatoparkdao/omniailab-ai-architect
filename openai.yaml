interface:
  display_name: "OmniAiLab AI 建筑与室内设计总设计师 1.5.0"
  short_description: "建筑与室内设计全流程 AI 总设计师 Skill，也是一个在关键节点逼你做判断的设计系统：开工先问清功能需求、面积指标、预算口径与目标交付深度（你说不清时给最短可交付的建议让你拍板），再按八个业务阶段 S1 项目启动与设计任务书 → S2 概念方案设计 → S3 平面方案设计（G3 平面确认后自动执行概念效果图）→ S4 初步设计与方案深化 → S5 三维建模与效果图表现 → S6 设计定稿与技术协调 → S7 CAD/BIM 施工图深化 → S8 物料清单与设计交付 一路推进，每阶段末尾一道确认门，你只需回答「确认」或「第 X 处要改」。专业能力 30 项岗位能力跨阶段复用（设计任务书／场地分析／原始图纸解析／概念方案／意向板与审美迭代／概念图解与评图／空间规划／布局优化／人体工学与尺度／概念效果图／室内设计／建筑设计／材料与色彩／灯光／机电协同／CAD 制图／3D 建模／场景渲染／AI 视觉表现／漫游／BIM 建模／设计审核／专业协调校核／施工深化与节点／造价适配／工程量计算／材料与物料表／交付文档／版本管理与交付／设计汇报与提案）。以统一空间模型（Canonical Spatial Model）为唯一几何权威：墙外移 300mm，平面／立面／天花／灯位／家具间距／工程量／图纸按依赖关系重算，已确认且不受影响的部分保持有效；任何修改先走变更影响分析，不做局部手改。可产出可编辑 DXF（方案深度与施工深度分开）、OBJ 三维网格、本地确定性示意图、可编辑 PPTX 提案（10 种汇报类型）、Markdown 与打印就绪 HTML、工程量与造价估算 JSON、变更影响报告；写出的文件都用独立实现复核，读不回即判失败。零硬依赖：DXF、网格、PPTX 都有内置写出器，不需要注册、不需要密钥、不需要联网即可跑通全流程；缺 Blender / FreeCAD / IfcOpenShell 时输出可直接运行的脚本并标 degraded，平台未配置时标 NOT_CONFIGURED 并列出缺什么。绝不假装做到：DXF 不改名成 DWG、三角网格不叫参数化 BIM、AI 效果图不作尺寸依据、没有 IFC 写出后端时只说输出「IFC 投影数据 + 生成脚本」。生成式创作能力（概念图、室内效果图、材质参考图、立面表现图、设计分析图、漫游与方案演示视频）唯一被授权主体是 OmniAiLab 平台，不可用时只交付完整任务包并逐张标 awaiting_platform，绝不改道第三方平台。结构安全、消防、无障碍、机电负荷与当地法规符合性的最终结论不在系统范围内，须由持证专业人员在项目所在地复核签署。"
  author: "OmniAiLab"
  developer: "Mochiball"
  default_prompt: "使用 $omniailab-ai-architect 开始设计。先问清四件事：① 项目类型与基本情况（住宅／办公／商业／餐饮／酒店／展厅，面积与层数）；② 功能需求与居住／使用者人数；③ 预算口径与目标交付深度（只要两套平面比一比，还是要图纸＋模型＋效果图＋物料清单＋汇报 PPT）；④ 手上有哪些资料（原始图纸、照片、现场测量数据，还是没有）。如果用户上传了户型图或设计任务书，先读它并按 S1 做原始图纸解析与场地条件分析；如果用户什么都没给，直接问上面四件事，也可以用 `python -m omniarchitect demo --out out` 跑一个 120㎡ 住宅示例让他先看懂流程。然后按 S1→S8 逐阶段推进，每阶段末尾给固定话术等用户回复「确认 / 通过 / 定稿 / 继续」才解锁下一阶段，不确认就停在原地改。平面方案（S3）是本流程最重要的一次拍板：给两到三套可横向比较的方案＋推荐＋理由＋备选，不给「两套都行」。G3 平面确认后立即执行概念效果图（门禁后置动作，不是独立阶段）。任何拿不准、报错、用户说「不会 / 看不懂 / 卡住了」时，先读 docs/MANUAL.md 对应小节（`python -m omniarchitect manual --topic <主题>`）再回答，不要凭印象编。禁止代业主决策，禁止把估算当结算依据，禁止把 AI 效果图当尺寸依据。"
policy:
  allow_implicit_invocation: true

