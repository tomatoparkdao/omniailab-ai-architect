[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniailab-ai-architect"
version = "1.20.0"
description = "OmniArchitect — AI chief designer for architecture and interior design: eight-stage workflow, canonical spatial model, real DXF/mesh/PPTX output"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "OmniAiLab" }]
keywords = ["architecture", "interior-design", "BIM", "DXF", "IFC", "PPTX", "agent-skills", "MCP"]

# The core runs with no third-party package at all. The extras only upgrade
# quality; nothing here is required to produce a valid drawing, model or report.
dependencies = []

[project.optional-dependencies]
cad = ["ezdxf>=1.1"]
geometry = ["shapely>=2.0"]
schema = ["jsonschema>=4.20"]
bim = ["ifcopenshell"]
setup = ["pyyaml>=6.0"]
imaging = ["pillow>=10.0"]
presentation = ["python-pptx>=1.0"]
dev = ["pytest>=8.0"]
all = ["ezdxf>=1.1", "shapely>=2.0", "jsonschema>=4.20", "pyyaml>=6.0",
       "pillow>=10.0", "python-pptx>=1.0", "pytest>=8.0"]

[project.scripts]
omniailab-ai-architect = "omniarchitect.cli:main"

[tool.setuptools]
# The importable package uses the internal engine codename `omniarchitect`,
# deliberately distinct from the product / skill name `omniailab-ai-architect`
# (which contains hyphens and therefore cannot be a package name). This also
# keeps the repository root free of a near-duplicate top-level directory.
packages = [
    "omniarchitect",
    "omniarchitect.adapters",
    "omniarchitect.knowledge",
    "omniarchitect.providers",
    "omniarchitect.tools",
    "omniarchitect.presentation",
    "omniarchitect.integration",
    "omniarchitect.tests",
]

[tool.setuptools.package-data]
omniarchitect = ["*.md"]

[tool.setuptools.data-files]
# Agent Skill payload: the root-level assets the SKILL.md points at.
"share/omniailab-ai-architect" = [
    "SKILL.md", "README.md", "README_EN.md", "AGENTS.md", "LICENSE", "VERSION",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["omniarchitect/tests"]
addopts = "-q"
